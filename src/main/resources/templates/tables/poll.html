<div class="row g-3">
  <div class="col-md-3" th:object="${statusPoll}">
    <div class="card h-100">
      <div class="card-body">
        <h6 class="card-text"><strong>Options</strong></h6>
        <ol class="card-text">
          <li th:each="option : *{options}" th:text="${option}"></li>
        </ol>
      </div>
      <div class="card-footer d-flex justify-content-end">
        <a th:href="@{/poll(uuid=*{uuid})}" class="btn btn-sm btn-outline-primary me-1">
          <i class="bi bi-eye-fill"></i>
        </a>
        <form th:action="@{/poll}" th:method="post" class="d-inline-block m-0">
          <input th:value="*{uuid}" name="uuid" type="hidden">
          <button class="btn btn-sm btn-outline-danger" name="_method" value="delete">
            <i class="bi bi-trash-fill"></i>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
